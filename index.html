<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <meta name="theme-color" content="#17352c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="567 神秘旅行">
  <meta name="application-name" content="567 神秘旅行">
  <meta name="msapplication-TileColor" content="#17352c">
  <meta name="msapplication-config" content="browserconfig.xml">
  <meta name="description" content="下一站，時間到了才知道｜567 宜蘭二日神秘旅程">
  <meta property="og:title" content="567 神秘小旅行">
  <meta property="og:description" content="下一站，時間到了才知道">
  <meta property="og:image" content="assets/og-mystery.png">
  <title>567 神秘小旅行</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#17352c">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css?v=20260805-3">
</head>
<body>
  <main class="app-shell">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="topbar minimal-topbar"><button class="refresh-button" id="refresh-button" type="button" aria-label="立即更新" title="立即更新">↻</button></header>

    <section class="content tab-page active" id="home">
      <div class="hero-photo"><img src="assets/home-mystery-quest.png" alt="567 Mystery Quest，未知才是旅程最精彩的開始"></div>
      <button class="home-secret-note clue-panel" data-tab="trip" type="button" aria-label="查看下一站倒數"><span class="clue-spark">✦</span><div class="secret-progress"><p><small>目前線索</small><b>0 / 8 已揭曉</b><em>下一站將於出發前一小時揭曉</em></p><div class="progress-dots" aria-label="已揭曉零個，共八個"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><i class="clue-arrow">›</i></button>
    </section>

    <section class="content tab-page" id="trip">
      <div class="page-intro"><p class="eyebrow">NEXT MISSION</p><h1>下一站，<br><em>時間到了才知道。</em></h1><p>示範任務｜9月4日第一站</p></div>
      <div class="reveal-stage">
        <div class="mystery-card locked" id="mission-card" aria-live="polite">
          <div class="mystery-orbit"><span id="mission-icon">?</span><i></i></div>
          <small id="mission-status">UNLOCKS ONE HOUR BEFORE</small>
          <strong id="mission-title">目的地暫時保密</strong>
          <div id="locked-content">
            <div class="countdown" id="countdown" aria-label="距離解鎖倒數"></div>
            <p class="clue"><span>CLUE 01</span>香氣會先替我們帶路</p>
          </div>
          <div class="revealed-details" id="revealed-content" hidden><p>用美食開啟宜蘭小旅行</p><span>集合時間｜12:00</span><span>準備｜帶著空空的胃</span></div>
        </div>
        <button class="test-button" id="test-reveal"><span>✦</span><p><b>測試：模擬時間到</b><small>按下後查看正式揭曉效果</small></p></button>
      </div>
      <div class="tip-card"><span>RULE</span><p>正式上線時可移除測試按鈕，時間一到就會自動揭曉。</p></div>
    </section>

    <section class="content tab-page" id="group">
      <div class="page-intro group-intro"><p class="eyebrow">LOOK UP</p><h1>快速查詢，<br><em>我的車與房。</em></h1><p>37 位旅伴 · 12 車 · 12 房</p></div>
      <form class="name-search" id="name-search" autocomplete="off">
        <label for="traveler-name">輸入你的姓名</label>
        <div class="search-field"><input id="traveler-name" name="name" type="text" autocomplete="name" inputmode="text" placeholder="例如：陳怡靜" required><button type="submit">查詢</button></div>
        <small>請輸入分房分車表上的姓名</small>
      </form>
      <div class="query-message" id="query-message" role="status" hidden></div>
      <section class="query-result" id="query-result" aria-live="polite" hidden>
        <div class="personal-trip-card"><div class="result-welcome"><span>旅</span><p><small>MY TRIP CARD</small><strong id="result-name"></strong></p></div>
        <div class="result-grid">
          <article class="result-card car-result"><small>搭乘車輛</small><b id="result-car"></b><p>車長</p><strong id="result-leader"></strong><em id="result-leader-note"></em></article>
          <article class="result-card room-result"><small>住宿房間</small><b id="result-room"></b><p>房型</p><strong id="result-room-type"></strong></article>
        </div>
        <article class="roommates-card"><small>ROOMMATES</small><h2>今晚的室友</h2><div id="result-roommates"></div></article></div>
        <button class="search-again" id="search-again" type="button">重新查詢</button>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="active" data-tab="home"><span>⌂</span><b>首頁</b></button>
      <button data-tab="trip"><span>◫</span><b>行程</b></button>
      <button data-tab="group"><span>◎</span><b>查詢</b></button>
    </nav>
  </main>
  <div class="rotate-guard" aria-hidden="true"><div><span>⟳</span><b>請直立使用</b><small>567 神秘小旅行僅支援直式畫面</small></div></div>
  <script src="app.js?v=20260805-3"></script>
</body>
</html>
